  .cardHead { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); flex-wrap:wrap; }

  .box.now { border-color: var(--brand-line); background: var(--brand-soft); }
  .label { font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .big { font-family:var(--font-display); font-weight:600; font-size:var(--text-2xl); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }

  .body { font-size:14px; font-weight:600; line-height:1.45; }
  .meta { font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:6px; line-height:1.5; }

  .exList li { display:flex; justify-content:space-between; gap:var(--space-3); padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }

  .dayRow .x { font-family:var(--font-mono); font-size:12px; color:var(--brand); white-space:nowrap; }

  .phaseHead { font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:var(--space-4) 0 var(--space-2); }

  .lr .wk { font-family:var(--font-mono); color:var(--muted); white-space:nowrap; }
  .lr .km { font-family:var(--font-mono); text-align:right; white-space:nowrap; font-weight:600; }
  .lr .track { height:10px; border-radius:5px; background:var(--track); overflow:hidden; }
  .lr .fill { height:100%; border-radius:5px; background:var(--brand); opacity:.75; }
  .lr.deload .fill { background:var(--warn); }
  .lr.race .fill { background:var(--pos); opacity:1; }
  .lr.past { opacity:.45; }
  .lr.current { background:var(--brand-soft); border-radius:6px; padding:5px 6px; margin:0 -6px; }
  .lr.current .wk, .lr.current .km { color:var(--brand); }
  .lrNote { grid-column:2 / -1; font-size:11px; color:var(--muted); margin-top:-2px; }
  .legend { display:flex; gap:var(--space-4); flex-wrap:wrap; font-family:var(--font-mono); font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }

  .zoneChip { display:flex; flex-direction:column; gap:2px; padding:8px 12px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border); flex:1; min-width:120px; }

  .zoneChip .zL { font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

  .tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th { text-align:left; font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:500; padding:6px 8px 6px 0; border-bottom:1px solid var(--border); }

  .note { font-size:12px; color:var(--muted); line-height:1.5; }

  details.card > summary::after { content:'+'; font-family:var(--font-mono); color:var(--muted); font-size:18px; }

/* ============================================================
 * Helpers
 * ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// The export writes ranges/sets with ASCII hyphens and "x"; show them typographically.
function pretty(s){ return esc(s).replace(/(\d)-(\d)/g, '$1–$2').replace(/(\d)x(\d)/g, '$1×$2').replace(/ - /g, ' — ').replace(/-&gt;/g, '→'); }
function dayStart(d){ const t = new Date(d); t.setHours(0,0,0,0); return t; }
function parseKey(k){ return new Date(k + 'T00:00:00'); }
function weekOf(startKey, d){
  const days = Math.floor((dayStart(d) - parseKey(startKey)) / 86400000);
  return days < 0 ? 0 : Math.floor(days / 7) + 1;
}
function daysUntil(key){ return Math.round((parseKey(key) - dayStart(new Date())) / 86400000); }
function fmtShort(key){ return parseKey(key).toLocaleDateString([], { day:'numeric', month:'short' }); }

const RM = PLAN.marathonRoadmap;
const HB = PLAN.hybridPerformanceBlock;
const LOADS = HB.prescribedLoadsKg;
const PLAN_START = RM.phases[0].startDate; // Monday of week 1
const TOTAL_WEEKS = RM.phases.reduce((n, p) => n + p.lengthWeeks, 0);
const LONG_RUNS = RM.phases.flatMap(p => p.longRunByWeek.map(w => Object.assign({ phase: p }, w)));
const RACES = [RM.races.halfMarathon, RM.races.fullMarathon];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function kmLabel(w){ return w.distanceKmRange ? w.distanceKmRange.join('–') + ' km' : w.distanceKm + ' km'; }
function kmValue(w){ return w.distanceKmRange ? w.distanceKmRange[1] : w.distanceKm; }
const BC = RM.bodyCompositionGoal;
// Core work stays in every week of the build, even once the other accessories go.
const CORE = { Mon: HB.strengthSessions.mondayLowerSquatFocus[4], Thu: HB.strengthSessions.thursdayLowerHingeUnilateral[4] };
// Daily calorie target by day type; the Phase 3 long runs of 30km+ get the bigger number.
function kcalFor(type, wk){
  const c = BC.dayTypeCaloriesKcal;
  if (type === 'long') { const lr = LONG_RUNS.find(w => w.week === wk); return (lr.phase.id === 3 && kmValue(lr) >= 30) ? c.bigLongRunDay_30to34km_phase3 : c.longRunDay; }
  return { rest: c.restDay, easy: c.strengthOrEasyRunDay, quality: c.qualityRunDayWed }[type];
}
function phaseForWeek(wk){ return RM.phases.find(p => wk >= p.longRunByWeek[0].week && wk <= p.longRunByWeek[p.longRunByWeek.length-1].week) || null; }

/* Mon/Thu main-lift loads for a given plan week. Phase 1 follows the
 * Hybrid Block's own calendar (it started a week earlier, so its deloads
 * land a week before the long-run deloads); Phase 2 uses the trimmed
 * main-lift-only numbers; Phase 3 has no loaded lifts. */
function strengthFor(wk, d){
  if (wk <= 11) {
    const hw = weekOf(HB.startDate, d);
    const sq = hw <= 3 ? LOADS.squatMonday[0] : (hw === 4 || hw === 8) ? LOADS.squatMonday[1] : hw <= 7 ? LOADS.squatMonday[2] : hw <= 11 ? LOADS.squatMonday[3] : LOADS.squatMonday[4];
    const dl = (hw === 4 || hw === 8 || hw === 12) ? LOADS.deadliftThursday[1] : LOADS.deadliftThursday[0];
    return {
      label: 'Hybrid block week ' + hw + ' · ' + (HB.roadmap[hw-1] ? HB.roadmap[hw-1].block : ''),
      deload: hw === 4 || hw === 8 || hw === 12,
      squat: { rx: sq.prescription, kg: sq.weightKg != null ? sq.weightKg + ' kg' : 'find the new number' },
      deadlift: { rx: dl.prescription, kg: dl.weightKg + ' kg' },
      full: true
    };
  }
  if (wk <= 18) {
    const taper = wk >= 16, deload = wk === 14;
    return {
      label: deload ? 'Deload week' : taper ? (wk === 18 ? 'Race week — keep it light or skip' : 'Taper') : 'Main lift only',
      deload: deload || taper,
      squat: { rx: 'Main lift only, lighter', kg: taper ? '~145–150 kg' : '~150–155 kg' },
      deadlift: { rx: 'Main lift only, lighter', kg: (deload || taper) ? '120–125 kg' : '~150 kg' },
      full: false
    };
  }
  return null;
}

function racesHtml(){
  return '<div class="raceGrid">' + RACES.map(r => {
    const n = daysUntil(r.date);
    const val = n > 0 ? n + '<small>days</small>' : n === 0 ? 'Race day' : 'Done ✓';
    return '<div class="box"><div class="label">' + esc(r.name) + ' · ' + r.distanceKm + ' km</div>'
      + '<div class="big">' + val + '</div>'
      + '<div class="meta">' + parseKey(r.date).toLocaleDateString([], { weekday:'short', day:'numeric', month:'short', year:'numeric' }) + (r.role ? '<br>' + pretty(r.role) : '') + '</div></div>';
  }).join('') + '</div>';
}

function heroHtml(){
  const now = new Date();
  const wk = weekOf(PLAN_START, now);
  let badge, body;
  if (wk < 1) {
    badge = '<span class="badge muted">starts ' + fmtShort(PLAN_START) + '</span>';
    body = '<p class="cardTag">' + esc(RM.verdict) + '</p>';
  } else if (wk > TOTAL_WEEKS) {
    badge = '<span class="badge race">plan complete</span>';
    body = '<p class="cardTag">Both races are done. Time for a recovery block — then a new plan.</p>';
  } else {
    const ph = phaseForWeek(wk), lr = LONG_RUNS.find(w => w.week === wk);
    badge = '<span class="badge' + (lr.race ? ' race' : lr.deload ? ' deload' : '') + '">week ' + wk + '/' + TOTAL_WEEKS + ' · ' + esc(ph.name) + (lr.deload ? ' · deload' : '') + '</span>';
    body = '<p class="cardTag">' + pretty(ph.goal) + '</p>';
  }
  return '<section class="card"><div class="cardHead"><span class="cardName">Countdown</span>' + badge + '</div>' + racesHtml() + body + '</section>';
}

function todayHtml(){
  const now = new Date();
  const wk = weekOf(PLAN_START, now);
  if (wk < 1 || wk > TOTAL_WEEKS) return '';
  const ph = phaseForWeek(wk), lr = LONG_RUNS.find(w => w.week === wk);
  const dow = DAYS[(now.getDay() + 6) % 7];
  const ub = RM.upperBodyMaintenance, st = strengthFor(wk, now);
  let title, detail = '', fuel;

  if (dow === 'Sat' || dow === 'Sun') {
    title = lr.race ? 'Race week — ' + esc(lr.race) : 'Long run — ' + kmLabel(lr) + ' (Sat or Sun)';
    detail = '<p class="cardTag">The other weekend day is ' + esc(ph.weeklyStructure.SunOrSat.toLowerCase()) + '. ' + pretty(ph.weeklyStructure.SatOrSun) + (lr.notes ? ' · ' + pretty(lr.notes) : '') + '.</p>';
    fuel = '<b>' + pretty(kcalFor('long', wk)) + ' kcal</b> on the long-run day · <b>' + kcalFor('rest', wk) + ' kcal</b> on the rest day';
  } else {
    fuel = '<b>' + kcalFor(dow === 'Wed' ? 'quality' : 'easy', wk) + ' kcal</b>';
    title = pretty(ph.weeklyStructure[dow]);
    if ((dow === 'Mon' || dow === 'Thu') && !st) {
      detail = '<ul class="exList"><li><span>' + pretty(CORE[dow].exercise) + '</span><span class="val">' + pretty(CORE[dow].sets) + '</span></li></ul>'
        + '<p class="note">Core stays in every week of the build — low-fatigue, and it serves the body-comp goal.</p>';
    } else if ((dow === 'Mon' || dow === 'Thu') && st) {
      const lift = dow === 'Mon' ? st.squat : st.deadlift;
      const liftName = dow === 'Mon' ? 'Back Squat' : 'Deadlift';
      const accessories = st.full ? (dow === 'Mon' ? HB.strengthSessions.mondayLowerSquatFocus : HB.strengthSessions.thursdayLowerHingeUnilateral).slice(1) : [CORE[dow]];
      detail = '<ul class="exList"><li class="main"><span>' + liftName + ' · ' + pretty(lift.rx) + '</span><span class="val">' + pretty(lift.kg) + '</span></li>'
        + accessories.map(e => '<li><span>' + pretty(e.exercise) + '</span><span class="val">' + pretty(e.sets) + '</span></li>').join('')
        + '</ul><p class="note">' + esc(st.label) + '. Autoregulate by RPE on the day — these are starting points, not targets to force.</p>';
    } else if ((dow === 'Tue' || dow === 'Fri') && wk < 22) {
      const list = dow === 'Tue' ? ub.tuesday : ub.friday;
      detail = '<ul class="exList">' + list.map(x => '<li><span>' + pretty(x) + '</span><span class="val">2–3 sets</span></li>').join('') + '</ul>'
        + '<p class="note">Upper-body maintenance: ' + pretty(ub.whenTueFri) + '.</p>';
    }
  }
  return '<section class="card"><div class="cardHead"><span class="cardName">Today</span><span class="badge muted">' + now.toLocaleDateString([], { weekday:'long', day:'numeric', month:'short' }) + '</span></div>'
    + '<div class="body">' + title + '</div>' + detail
    + '<p class="note">Fuel today: ' + fuel + ' · ' + BC.proteinG + ' g protein</p>'
    + (wk >= 22 ? '<p class="note">' + pretty(BC.priorityCaveat) + '</p>' : '')
    + '</section>';
}

function weekHtml(){
  const now = new Date();
  const wk = weekOf(PLAN_START, now);
  if (wk < 1 || wk > TOTAL_WEEKS) return '';
  const ph = phaseForWeek(wk), lr = LONG_RUNS.find(w => w.week === wk);
  const today = DAYS[(now.getDay() + 6) % 7];
  const st = strengthFor(wk, now);
  const rows = DAYS.map(d => {
    let text, extra = '';
    if (d === 'Sat') { text = ph.weeklyStructure.SatOrSun; extra = lr.race ? 'RACE' : kmLabel(lr); }
    else if (d === 'Sun') text = ph.weeklyStructure.SunOrSat + ' (or long run, if Sat was rest)';
    else text = ph.weeklyStructure[d];
    if (d === 'Mon' && st) extra = st.squat.kg;
    if (d === 'Thu' && st) extra = st.deadlift.kg;
    return '<div class="dayRow' + (d === today ? ' today' : '') + '"><span class="d">' + d + '</span><span>' + pretty(text) + '</span><span class="x">' + pretty(extra) + '</span></div>';
  }).join('');
  return '<section class="card"><div class="cardHead"><span class="cardName">This week</span><span class="badge muted">' + fmtShort(lr.dates.split('/')[0]) + ' – ' + fmtShort(lr.dates.split('/')[1]) + '</span></div><div>' + rows + '</div>'
    + (lr.notes ? '<p class="note">' + pretty(lr.notes) + '</p>' : '')
    + '</section>';
}

function strengthHtml(){
  const wk = weekOf(PLAN_START, new Date());
  const hw = wk >= 1 && wk <= 11 ? weekOf(HB.startDate, new Date()) : 0;
  const isNow = (block) => {
    if (!hw) return false;
    if (/deload/.test(block)) return (block.match(/\d+/g) || []).map(Number).includes(hw);
    if (/constant/.test(block)) return hw !== 4 && hw !== 8 && hw !== 12;
    const m = block.match(/weeks (\d+)-(\d+)/);
    return !!m && hw >= +m[1] && hw <= +m[2];
  };
  const table = (rows) => '<div class="tblWrap"><table class="tbl"><tr><th>Block</th><th>Sets</th><th>%1RM</th><th>Load</th></tr>'
    + rows.map(r => '<tr' + (isNow(r.block) ? ' class="now"' : '') + '><td>' + pretty(r.block) + '</td><td>' + pretty(r.prescription) + '</td><td class="n">' + pretty(r.percent1RM != null ? r.percent1RM + '%' : '—') + '</td><td class="n">' + pretty(r.weightKg != null ? r.weightKg + ' kg' : '—') + '</td></tr>').join('')
    + '</table></div>';
  const rm = PLAN.athlete.oneRepMaxesKg;
  return '<details class="card"><summary><span class="cardName">Strength loads (Mon / Thu)</span></summary>'
    + '<div class="zoneRow">'
    + '<div class="zoneChip"><span class="zN">' + rm.squat + ' kg</span><span class="zL">Squat 1RM</span></div>'
    + '<div class="zoneChip"><span class="zN">' + rm.deadlift + ' kg</span><span class="zL">Deadlift 1RM</span></div>'
    + '<div class="zoneChip"><span class="zN">' + rm.benchPress + ' kg</span><span class="zL">Bench 1RM</span></div>'
    + '</div>'
    + '<div class="label" style="margin-top:var(--space-2)">Phase 1 · Monday squat</div>' + table(LOADS.squatMonday)
    + '<div class="label" style="margin-top:var(--space-2)">Phase 1 · Thursday deadlift</div>' + table(LOADS.deadliftThursday)
    + '<p class="note">"Weeks" in these tables are Hybrid Block weeks (started ' + fmtShort(HB.startDate) + '), one ahead of the marathon plan\'s week count.</p>'
    + '<div class="label" style="margin-top:var(--space-2)">Phase 2</div><p class="note">' + pretty(RM.phases[1].strengthNote) + '</p>'
    + '<div class="label">Phase 3</div><p class="note">' + pretty(RM.phases[2].strengthNote) + '</p>'
    + '<div class="label">Progression</div><p class="note">' + pretty(HB.strengthSessions.progressionRule) + ' ' + pretty(LOADS.method) + '</p>'
    + '<div class="label">Shoulder</div><p class="note">' + pretty(PLAN.athlete.shoulder) + '.</p>'
    + '</details>';
}

function nutritionHtml(){
  const n = PLAN.nutrition, m = n.macrosDaily, f = n.raceFueling, c = BC.dayTypeCaloriesKcal;
  const dayTypes = [['Rest day', c.restDay], ['Strength or easy-run day', c.strengthOrEasyRunDay], ['Wed quality run', c.qualityRunDayWed], ['Long-run day', c.longRunDay], ['Phase 3 long run, 30–34 km', c.bigLongRunDay_30to34km_phase3]];
  return '<details class="card"><summary><span class="cardName">Fuel & body composition</span></summary>'
    + '<div class="label">Goal</div><p class="note">' + pretty(BC.stated) + '. ' + pretty(BC.approach) + '</p>'
    + '<div class="tblWrap"><table class="tbl"><tr><th>Day type</th><th>kcal</th></tr>'
    + dayTypes.map(r => '<tr><td>' + r[0] + '</td><td class="n">' + pretty(r[1]) + '</td></tr>').join('')
    + '</table></div>'
    + '<p class="note">Protein ' + BC.proteinG + ' g every day — ' + pretty(BC.proteinNote).replace(/^S/, 's') + '.</p>'
    + '<ul class="bullets"><li>' + pretty(BC.coreWork) + '</li><li>Track: ' + BC.tracking.map(pretty).join(' · ') + '</li><li>' + pretty(BC.priorityCaveat) + '</li></ul>'
    + '<div class="label" style="margin-top:var(--space-2)">Baseline maintenance</div>'
    + '<div class="zoneRow">'
    + '<div class="zoneChip"><span class="zN">' + n.targetIntakeKcal + '</span><span class="zL">kcal / day</span></div>'
    + '<div class="zoneChip"><span class="zN">' + m.proteinG + ' g</span><span class="zL">Protein</span></div>'
    + '<div class="zoneChip"><span class="zN">' + m.carbsG + ' g</span><span class="zL">Carbs</span></div>'
    + '<div class="zoneChip"><span class="zN">' + m.fatG + ' g</span><span class="zL">Fat</span></div>'
    + '</div><p class="note">' + pretty(n.goalType) + '. BMR ' + n.bmrKcal + ' kcal (' + pretty(n.basis) + ').</p>'
    + '<ul class="bullets">' + n.guidance.map(x => '<li>' + pretty(x) + '</li>').join('') + '</ul>'
    + '<div class="label" style="margin-top:var(--space-2)">During long runs & races</div>'
    + '<ul class="bullets"><li>' + pretty(f.duringRun) + '</li><li>' + pretty(f.practiceRule) + '</li><li>' + pretty(f.hydration) + '</li></ul>'
    + '</details>';
}

function rulesHtml(){
  return '<details class="card"><summary><span class="cardName">Rules</span></summary>'
    + '<div class="label">Marathon roadmap</div><ul class="bullets">' + RM.rules.map(x => '<li>' + pretty(x) + '</li>').join('') + '</ul>'
    + '<div class="label" style="margin-top:var(--space-2)">Strength & recovery</div><ul class="bullets">' + HB.rules.filter(x => !/Hybrid Mile|Hybrid equipment/.test(x)).map(x => '<li>' + pretty(x) + '</li>').join('') + '</ul>'
    + '</details>';
}

function render(){
  document.getElementById('app').innerHTML = heroHtml() + todayHtml() + weekHtml() + longRunsHtml() + pacingHtml() + strengthHtml() + nutritionHtml() + rulesHtml();
}
render();
// Roll the "today" view over at midnight if the tab stays open.
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
</script>
</body>
</html>
