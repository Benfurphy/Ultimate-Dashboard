<style>
  .shell { max-width: 760px; }
  .stack { display:flex; flex-direction:column; gap: var(--space-4); }

  .weekBadge { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:4px 10px; border-radius:var(--radius-pill); background:var(--brand-soft); border:1px solid var(--brand-line); color:var(--brand); }
  .weekBadge.deload { background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn); }
  .weekBadge.muted { background:var(--surface); border-color:var(--border); color:var(--muted); }

  .planGrid { display:grid; grid-template-columns:1fr 1fr; gap: var(--space-3); margin-top: var(--space-4); }
  @media (max-width:560px) { .planGrid { grid-template-columns:1fr; } }
  .planBox { padding: var(--space-4); border:1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
  .planBox .planLabel { font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .planBox .planBody { font-size:14px; font-weight:600; line-height:1.4; }
  .planBox .planDay { font-family:var(--font-mono); font-size:11px; color:var(--brand); margin-top:6px; }

  .zoneRow { display:flex; gap:var(--space-2); flex-wrap:wrap; margin-top: var(--space-4); }
  .zoneChip { display:flex; flex-direction:column; gap:2px; padding:8px 12px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border); flex:1; min-width:120px; }
  .zoneChip .zN { font-family:var(--font-display); font-weight:600; font-size:var(--text-base); font-variant-numeric:tabular-nums; }
  .zoneChip .zL { font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

  .logForm { display:grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); align-items:end; }
  @media (max-width:560px) { .logForm { grid-template-columns: 1fr 1fr; } }
  .logField { display:flex; flex-direction:column; gap:4px; }
  .logField label { font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .logSubmitRow { grid-column: 1 / -1; display:flex; gap:var(--space-3); align-items:center; }
  .logNotes { grid-column: 1 / -1; }

  .rowItem { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); padding:10px 0; border-bottom:1px solid var(--border); }
  .rowItem:last-child { border-bottom:0; }
  .rowMain { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .rowName { font-weight:600; font-size:14px; }
  .rowMeta { font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .rowRight { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .rowVal { font-family:var(--font-mono); font-weight:700; color:var(--brand); font-size:13px; white-space:nowrap; }
  .rowDel { appearance:none; background:transparent; border:0; color:var(--muted); font-size:18px; line-height:1; cursor:pointer; padding:4px 8px; border-radius:6px; }
  .rowDel:hover { color:var(--neg); }
  .rowEmpty { text-align:center; padding: var(--space-5) 0; color:var(--muted); font-size:13px; font-style:italic; }
  .typeTag { font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:var(--radius-pill); background:var(--brand-soft); color:var(--brand); }
  .typeTag.long { background:var(--pos-soft); color:var(--pos); }
  .typeTag.extra { background:var(--surface); color:var(--muted-strong); border:1px solid var(--border); }

  .weekProgress { display:flex; gap:6px; margin-top:var(--space-3); }
  .weekProgress .wp { flex:1; height:6px; border-radius:3px; background:var(--track); }
  .weekProgress .wp.done { background:var(--pos); }

  .readinessCard { border-color: var(--warn-line); }
  .readinessCard.low { border-color: var(--neg-line, var(--warn-line)); }
  .readinessHead { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); flex-wrap:wrap; }
  .readinessActions { display:flex; align-items:center; gap:var(--space-3); margin-top:var(--space-3); }
  .readinessApplied { font-size:13px; font-weight:600; color:var(--pos); }
  .planDay.wasPlan { color:var(--muted); font-family:var(--font-mono); }
  .garminImportCard { border-color: var(--pos-line); }
</style>

<main class="page grain-overlay">

<script src="theme.js"></script>
<script>
document.getElementById('themeSeg').innerHTML = Patron.switcherHtml();

/* ============================================================
 * Helpers
 * ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function localDateKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDateKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}); }
function parseTimeStr(s){
  const parts = String(s||'').trim().split(':').map(x=>Number(x));
  if (!parts.length || parts.some(x=>!isFinite(x))) return null;
  let secs = 0;
  for (const p of parts) secs = secs*60 + p;
  return secs > 0 ? secs : null;
}
function fmtTimeStr(totalSec){
  totalSec = Math.round(totalSec);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return h>0 ? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0') : m+':'+String(s).padStart(2,'0');
}
function fmtPace(minPerKm){
  if (minPerKm == null || !isFinite(minPerKm) || minPerKm<=0) return '—';
  const m = Math.floor(minPerKm), s = Math.round((minPerKm-m)*60);
  return m+':'+String(s).padStart(2,'0')+'/km';
}

/* ============================================================
 * Marathon Roadmap (Oct 2026 – Apr 2027) — the run side of race-plan.html,
 * kept as an independent copy here since each page in the suite is
 * self-contained. Supersedes the Hybrid Block's Wed intervals + long run.
 * ============================================================ */
const PROGRAM_START = '2026-10-26'; // Monday
const TOTAL_WEEKS = 25;

// Tue/Fri easy run — upper-body maintenance drops from week 22.
function easyPlan(wk){ return wk < 22 ? 'Easy 30–40min + 15–20min upper-body maintenance' : 'Easy 30–40min'; }
// Wednesday session, by week.
const WED_PLAN = {};
for (let w = 1; w <= 11; w++) WED_PLAN[w] = 'Steady/moderate 30–45min, occasional strides (no hard intervals yet)';
for (let w = 12; w <= 18; w++) WED_PLAN[w] = 'Tempo or half-marathon-pace run (continuous, or blocks at HM effort)';
for (let w = 19; w <= 25; w++) WED_PLAN[w] = 'Steady run, easy–moderate only — no added intensity';
// Weekend long run target, by week.
const LONG_PLAN = {
  1:'13km easy', 2:'14km easy', 3:'15km easy', 4:'10km easy (deload)',
  5:'16km easy', 6:'17km easy', 7:'18km easy', 8:'11km easy (deload)',
  9:'14–16km (Christmas — flexible)', 10:'16–18km (New Year — flexible)', 11:'19km easy',
  12:'20km', 13:'21km — matches race distance', 14:'14km easy (deload)', 15:'22km — peak, past race distance',
  16:'16km (taper)', 17:'12km easy (taper)', 18:'RACE: Bendigo Half Marathon · 21.1km, Sun 28 Feb',
  19:'12km very easy (recovery)', 20:'22km', 21:'28km', 22:'32km — first run over 30km', 23:'34km — peak long run (coach-directed)',
  24:'19km easy (taper)', 25:'RACE: Ballarat Marathon · 42.2km, Sun 18 Apr'
};
const DELOAD_WEEKS = [4, 8, 14, 19];

function programWeekNumber(d){
  d = d || new Date();
  const start = new Date(PROGRAM_START + 'T00:00:00');
  const t = new Date(d); t.setHours(0,0,0,0); start.setHours(0,0,0,0);
  const days = Math.floor((t - start) / 86400000);
  if (days < 0) return 0;
  return Math.floor(days / 7) + 1;
}
function programWeekInfo(d){
  const wk = programWeekNumber(d);
  if (wk < 1) {
    const daysUntil = Math.ceil((new Date(PROGRAM_START + 'T00:00:00') - new Date()) / 86400000);
    return { status:'upcoming', week:0, daysUntil };
  }
  if (wk > TOTAL_WEEKS) return { status:'complete', week: TOTAL_WEEKS };
  return { status:'active', week: wk, deload: DELOAD_WEEKS.indexOf(wk) !== -1, easy: easyPlan(wk), wed: WED_PLAN[wk], long: LONG_PLAN[wk] };
}

/* ============================================================
 * Persisted state — manually logged runs.
 * ============================================================ */
const LS = 'running_standalone_v1';
function seed(){ return { version:1, runs:[], garminHandled:[] }; }
function load(){
  try {
    const r = localStorage.getItem(LS);
    const s = r ? Object.assign(seed(), JSON.parse(r)) : seed();
    if (!Array.isArray(s.runs)) s.runs = [];
    if (!Array.isArray(s.garminHandled)) s.garminHandled = [];
    return s;
  } catch(e){ return seed(); }
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
let state = load();
const ui = { type: todaySessionType() || 'extra', distance:'', time:'', pace:'', intervals:'', notes:'', date: localDateKey() };

const TYPE_LABEL = { easy:'Tue/Fri Easy', interval:'Wed Steady/Tempo', long:'Long Run', extra:'Extra' };

/* ============================================================
 * Recovery-adjusted plan — reads today's Garmin Training Readiness
 * (synced by index.html's vitals flow into patron_health_v1) and, on
 * request, swaps today's scheduled session for an easier version.
 * Suggestion-only: the week's plan above keeps showing as normal until
 * the user taps Apply, and it auto-expires at midnight (keyed by date).
 * ============================================================ */
const HEALTH_KEY = 'patron_health_v1';
const READINESS_KEY = 'running_readiness_v1';
const RUN_ADJ = {
  moderate: { label:'Moderate', easy:'Keep it short — 20–25min fully conversational, and skip the upper-body add-on.', interval:'Swap to an easy continuous run (about 20–25min) instead of today’s steady/tempo session.', long:'Keep the whole run easy — drop any tempo/surge segment in this week’s target.' },
  low:      { label:'Low',      easy:'Swap the run for a 20min walk or full rest.', interval:'Skip the quality today — an easy 15–20min jog or full rest is fine.',        long:'Cut the distance by roughly a third and keep it fully conversational, or take the day off.' }
};
function readReadiness(){
  try {
    const raw = localStorage.getItem(HEALTH_KEY);
    const h = raw ? JSON.parse(raw) : null;
    const score = h && h.trainingReadiness != null ? Math.round(h.trainingReadiness) : null;
    if (score == null) return null;
    const tier = score < 45 ? 'low' : score < 70 ? 'moderate' : 'high';
    return { score, tier };
  } catch(e){ return null; }
}
// Easy = Tue/Fri; Wed session = 'interval' (matches WED_PLAN); long run = weekend (matches LONG_PLAN).
function todaySessionType(){
  const dow = new Date().getDay();
  if (dow === 2 || dow === 5) return 'easy';
  if (dow === 3) return 'interval';
  if (dow === 0 || dow === 6) return 'long';
  return null;
}
function loadReadinessOverride(){
  try { const raw = localStorage.getItem(READINESS_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function saveReadinessOverride(o){
  try { if (o) localStorage.setItem(READINESS_KEY, JSON.stringify(o)); else localStorage.removeItem(READINESS_KEY); } catch(e){}
}
function todaysReadinessOverride(){
  const o = loadReadinessOverride();
  return (o && o.date === localDateKey()) ? o : null;
}

/* ============================================================
 * Garmin import — same-origin /api/garmin?action=activities (the Fitness
 * tab's own endpoint). Offers to pre-fill today's log from a matching
 * Garmin activity rather than typing distance/time/pace by hand; Intervals
 * and Notes stay yours since Garmin has no idea about either. Matched by
 * calendar date, not by guessing which planned session it is — the fixed
 * weekly split (Tue/Fri = easy, Wed = interval, weekend = long) already tells us that.
 * Silently does nothing if not deployed on Vercel or Garmin isn't connected.
 * ============================================================ */
let garminActivity = null; // the one unhandled activity from today, if any
async function fetchGarminImportCandidate(){
  try {
    const r = await fetch('/api/garmin?action=activities', { cache: 'no-store' });
    const j = await r.json();
    if (!j || !j.connected || !Array.isArray(j.activities)) return;
    const todayKey = localDateKey();
    const match = j.activities.find(a => a && a.id != null
      && localDateKey(new Date(a.ts)) === todayKey
      && state.garminHandled.indexOf(String(a.id)) === -1);
    if (match) { garminActivity = match; render(); }
  } catch (e) { /* not deployed on Vercel, or Garmin not connected — no-op */ }
}
function markGarminHandled(id){
  state.garminHandled.push(String(id));
  if (state.garminHandled.length > 200) state.garminHandled = state.garminHandled.slice(-200);
  save();
}
function garminImportCardHtml(){
  if (!garminActivity) return '';
  const a = garminActivity;
  const bits = [
    a.distanceKm ? a.distanceKm.toFixed(1) + 'km' : null,
    a.durationSec ? fmtTimeStr(a.durationSec) : null,
    a.paceMinPerKm ? fmtPace(a.paceMinPerKm) : null,
  ].filter(Boolean).join(' · ');
  return '<section class="card garminImportCard">'
    + '<span class="cardName">Garmin found a run today</span>'
    + '<p class="cardTag" style="margin-top:var(--space-2)">' + esc(bits || a.name || 'Run') + '</p>'
    + '<div class="readinessActions"><button type="button" class="btn btn-primary" data-action="garmin-import">Import</button>'
    + '<button type="button" class="btn btn-secondary" data-action="garmin-dismiss">Dismiss</button></div>'
    + '</section>';
}
function readinessBannerHtml(){
  const session = todaySessionType();
  const r = readReadiness();
  if (!session || !r || r.tier === 'high') return '';
  const adj = RUN_ADJ[r.tier];
  const override = todaysReadinessOverride();
  const applied = !!(override && override.tier === r.tier && override.session === session);
  const sessionLabel = { easy:"today's easy run", interval:"today's Wednesday run", long:"today's long run" }[session];
  return '<section class="card readinessCard' + (r.tier==='low'?' low':'') + '">'
    + '<div class="readinessHead"><span class="cardName">Recovery</span><span class="weekBadge' + (r.tier==='low'?' deload':'') + '">Training Readiness ' + r.score + ' · ' + adj.label + '</span></div>'
    + '<p class="cardTag" style="margin-top:var(--space-3)">' + esc(adj[session]) + '</p>'
    + (applied
        ? '<div class="readinessActions"><span class="readinessApplied">✓ Applied to ' + esc(sessionLabel) + '</span><button type="button" class="btn btn-secondary" data-action="undo-readiness">Undo</button></div>'
        : '<div class="readinessActions"><button type="button" class="btn btn-primary" data-action="apply-readiness" data-session="' + session + '" data-tier="' + r.tier + '">Apply to ' + esc(sessionLabel) + '</button></div>')
    + '</section>';
}

/* ============================================================
 * Views
 * ============================================================ */
function weekHeroHtml(){
  const info = programWeekInfo();
  let badge, body;
  if (info.status === 'upcoming') {
    badge = '<span class="weekBadge muted">starts in ' + info.daysUntil + (info.daysUntil===1?' day':' days') + '</span>';
    body = '<p class="cardTag" style="margin-top:var(--space-3)">Your marathon roadmap kicks off ' + new Date(PROGRAM_START+'T00:00:00').toLocaleDateString([], {weekday:'long', month:'short', day:'numeric'}) + '. This week\'s targets will appear here once it starts.</p>';
  } else if (info.status === 'complete') {
    badge = '<span class="weekBadge muted">program complete</span>';
    body = '<p class="cardTag" style="margin-top:var(--space-3)">Both races done — nice work. Keep logging runs below.</p>';
  } else {
    const override = todaysReadinessOverride();
    const todayDow = new Date().getDay();
    // A recovery adjustment only rewrites the box for today's session.
    const box = (label, plan, session, dows) => {
      const adjusted = override && override.session === session && dows.indexOf(todayDow) !== -1 ? RUN_ADJ[override.tier][session] : null;
      return '<div class="planBox"><div class="planLabel">' + label + (adjusted ? ' · recovery-adjusted' : '') + '</div><div class="planBody">' + esc(adjusted || plan) + '</div>' + (adjusted ? '<div class="planDay wasPlan">was: ' + esc(plan) + '</div>' : '') + '</div>';
    };
    badge = '<span class="weekBadge' + (info.deload ? ' deload' : '') + '">week ' + info.week + '/' + TOTAL_WEEKS + (info.deload ? ' · deload' : '') + '</span>';
    body = '<div class="planGrid">'
      + box('Tue · Easy', info.easy, 'easy', [2])
      + box('Wed · ' + (info.week >= 12 && info.week <= 18 ? 'Tempo / race pace' : 'Steady'), info.wed, 'interval', [3])
      + box('Fri · Easy', info.easy, 'easy', [5])
      + box('Weekend · Long run', info.long, 'long', [6, 0])
      + '</div>'
      + weekProgressHtml(info.week);
  }
  return '<section class="card"><span class="cardName">This week</span>' + badge
    + body
    + '<div class="zoneRow">'
    + '<div class="zoneChip"><span class="zN">5:28–6:01</span><span class="zL">Easy /km</span></div>'
    + '<div class="zoneChip"><span class="zN">4:45–4:59</span><span class="zL">Tempo/threshold /km</span></div>'
    + '<div class="zoneChip"><span class="zN">4:12–4:26</span><span class="zL">Interval /km</span></div>'
    + '</div></section>';
}
function weekProgressHtml(week){
  const runsThisWeek = state.runs.filter(r => runWeekNumber(r) === week);
  // Four runs a week: two easy (any days), the Wednesday session, the long run.
  const easyN = runsThisWeek.filter(r => r.type === 'easy').length;
  const done = [easyN >= 1, runsThisWeek.some(r => r.type === 'interval'), easyN >= 2, runsThisWeek.some(r => r.type === 'long')];
  return '<div class="weekProgress">' + done.map(d => '<div class="wp' + (d?' done':'') + '"></div>').join('') + '</div>'
    + '<p class="cardTag" style="margin-top:6px">' + done.filter(Boolean).length + '/4 planned runs logged this week</p>';
}
function runWeekNumber(run){
  return programWeekNumber(new Date(run.dateKey + 'T12:00:00'));
}

function logFormHtml(){
  return '<section class="card"><span class="cardName">Log a run</span>'
    + '<form class="logForm" id="logForm" style="margin-top:var(--space-4)">'
    + '<div class="logField"><label for="f-date">Date</label><input id="f-date" class="fieldInput" type="date" value="' + esc(ui.date) + '"></div>'
    + '<div class="logField"><label for="f-type">Type</label><select id="f-type" class="fieldInput">'
    +   Object.keys(TYPE_LABEL).map(k => '<option value="' + k + '"' + (k===ui.type?' selected':'') + '>' + TYPE_LABEL[k] + '</option>').join('')
    + '</select></div>'
    + '<div class="logField"><label for="f-dist">Distance (km, optional)</label><input id="f-dist" class="fieldInput" type="number" step="0.1" min="0" placeholder="10" value="' + esc(ui.distance) + '"></div>'
    + '<div class="logField"><label for="f-time">Time (mm:ss, optional)</label><input id="f-time" class="fieldInput" type="text" placeholder="52:30" value="' + esc(ui.time) + '"></div>'
    + '<div class="logField"><label for="f-pace">Pace (min/km, optional)</label><input id="f-pace" class="fieldInput" type="text" placeholder="4:30" value="' + esc(ui.pace) + '"></div>'
    + '<div class="logField logNotes"><label for="f-intervals">Intervals (optional)</label><input id="f-intervals" class="fieldInput" type="text" placeholder="6×2min hard / 2min jog" value="' + esc(ui.intervals) + '"></div>'
    + '<div class="logField logNotes"><label for="f-notes">Notes (optional)</label><input id="f-notes" class="fieldInput" type="text" placeholder="felt good, shoulder fine" value="' + esc(ui.notes) + '"></div>'
    + '<div class="logSubmitRow"><button type="submit" class="btn btn-primary">Log run</button></div>'
    + '</form></section>';
}

function runsListHtml(){
  const runs = state.runs.slice().sort((a,b)=> b.dateKey.localeCompare(a.dateKey) || (b.ts||0)-(a.ts||0));
  if (!runs.length) return '<section class="card"><span class="cardName">Recent runs</span><p class="rowEmpty">Nothing logged yet — add your first run above.</p></section>';
  const rows = runs.map((r,i) => {
    // Prefer a typed pace (interval sessions with no clean distance/time) over
    // one derived from distance+time.
    const pace = r.paceMinPerKm ? fmtPace(r.paceMinPerKm) : (r.distanceKm && r.timeSec ? fmtPace((r.timeSec/60)/r.distanceKm) : null);
    const meta = [
      r.distanceKm ? r.distanceKm + 'km' : null,
      r.timeSec ? fmtTimeStr(r.timeSec) : null,
      pace,
      r.intervals ? esc(r.intervals) : null,
      r.notes ? esc(r.notes) : null,
    ].filter(Boolean).join(' · ');
    return '<div class="rowItem"><div class="rowMain">'
      + '<span class="rowName"><span class="typeTag' + (r.type==='long'?' long':r.type==='extra'?' extra':'') + '">' + TYPE_LABEL[r.type] + '</span> ' + fmtDateKey(r.dateKey) + '</span>'
      + '<span class="rowMeta">' + (meta || 'no details logged') + '</span>'
      + '</div><div class="rowRight">'
      + '<button class="rowDel" data-del="' + r.id + '" aria-label="Remove">×</button>'
      + '</div></div>';
  }).join('');
  return '<section class="card"><span class="cardName">Recent runs</span><div style="margin-top:var(--space-2)">' + rows + '</div></section>';
}

function render(){
  document.getElementById('app').innerHTML = garminImportCardHtml() + readinessBannerHtml() + weekHeroHtml() + logFormHtml() + runsListHtml();
}

/* ============================================================
 * Events
 * ============================================================ */
document.addEventListener('input', e => {
  if (e.target.id === 'f-date') ui.date = e.target.value;
  else if (e.target.id === 'f-dist') ui.distance = e.target.value;
  else if (e.target.id === 'f-time') ui.time = e.target.value;
  else if (e.target.id === 'f-pace') ui.pace = e.target.value;
  else if (e.target.id === 'f-intervals') ui.intervals = e.target.value;
  else if (e.target.id === 'f-notes') ui.notes = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-type') ui.type = e.target.value;
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'logForm') return;
  e.preventDefault();
  const dist = Number(ui.distance);
  const timeSec = parseTimeStr(ui.time);
  const paceSec = parseTimeStr(ui.pace);
  if (!ui.date) { alert('Pick a date.'); return; }
  state.runs.push({
    id: Date.now() + '-' + Math.round(Math.random()*1e5),
    dateKey: ui.date, type: ui.type,
    distanceKm: (isFinite(dist) && dist > 0) ? dist : null,
    timeSec: timeSec || null,
    paceMinPerKm: paceSec ? paceSec / 60 : null,
    intervals: ui.intervals.trim(),
    notes: ui.notes.trim(), ts: Date.now()
  });
  save();
  ui.distance = ''; ui.time = ''; ui.pace = ''; ui.intervals = ''; ui.notes = ''; ui.date = localDateKey();
  render();
});
document.addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    state.runs = state.runs.filter(r => String(r.id) !== del.getAttribute('data-del'));
    save();
    render();
    return;
  }
  const applyBtn = e.target.closest('[data-action="apply-readiness"]');
  if (applyBtn) {
    saveReadinessOverride({ date: localDateKey(), tier: applyBtn.dataset.tier, session: applyBtn.dataset.session });
    render();
    return;
  }
  const undoBtn = e.target.closest('[data-action="undo-readiness"]');
  if (undoBtn) {
    saveReadinessOverride(null);
    render();
    return;
  }
  const importBtn = e.target.closest('[data-action="garmin-import"]');
  if (importBtn && garminActivity) {
    const a = garminActivity;
    state.runs.push({
      id: Date.now() + '-' + Math.round(Math.random()*1e5),
      dateKey: localDateKey(), type: todaySessionType() || 'extra',
      distanceKm: a.distanceKm || null, timeSec: a.durationSec || null,
      paceMinPerKm: a.paceMinPerKm || null, intervals: '', notes: '', ts: Date.now()
    });
    markGarminHandled(a.id);
    garminActivity = null;
    save();
    render();
    return;
  }
  const dismissBtn = e.target.closest('[data-action="garmin-dismiss"]');
  if (dismissBtn && garminActivity) {
    markGarminHandled(garminActivity.id);
    garminActivity = null;
    render();
  }
});
window.addEventListener('storage', e => { if (e.key === LS) { state = load(); render(); } });

render();
fetchGarminImportCandidate();
</script>
</body>
</html>
